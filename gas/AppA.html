async function connect(){
  if(!(window.claude&&claude.use)){goLocal();return;}
  const [db,assets,dl,sample,user,gen]=await Promise.all(['db','assets','downloads','sample','user','gen'].map(n=>claude.use(n).catch(()=>null)));
  Object.assign(CAP,{db,assets,dl,sample,user,gen});
  if(!db){goLocal();return;}
  CAP.mode='shared';
  /* 権限は「確かに編集者だと分かったときだけ本社」。分からないときは店舗（原価は見えない側）にする */
  let role='store';
  if(user){try{const ed=await user.canEdit();if(ed===true)role='hq';else{const w=await user.can('data.write');if(w===false)role='client';}}catch(e){}}
  CAP.role=role;applyRole();
  if(role==='hq'){try{const s0=await db.doc('master/defaults').get();const dd=s0&&(typeof s0.data==='function'?(s0.exists===false?null:s0.data()):s0);
      if(dd&&dd.metals){MASTER0=dd;M=JSON.parse(JSON.stringify(MASTER0));MASTER_READY=true;}else toast('原価マスターの初期値が共有データにありません。原価マスターで入力してください');}catch(e){toast('原価マスターを読めませんでした');}}
  const t=setTimeout(()=>setConn('共有データの応答がありません','warn'),10000);
  if(role!=='client')db.collection('kartes').onSnapshot(s=>{clearTimeout(t);KARTES={};s.docs.forEach(d=>KARTES[d.id]=d.data());setConn('共有データ','ok');render();},e=>setConn('カルテを読めません：'+e.code,'warn'));
  if(role==='hq'){
    let first=true;
    db.collection('cases').onSnapshot(s=>{clearTimeout(t);CASES={};s.docs.forEach(d=>CASES[d.id]=d.data());
      if(first){first=false;const ids=sortedCases();if(ids.length&&!CASE)openCase(ids[0],true);}
      setConn('共有データ','ok');render();},e=>setConn('案件を読めません：'+e.code,'warn'));
    db.doc('master/main').onSnapshot(s=>{if(s.exists){M=Object.assign(JSON.parse(JSON.stringify(MASTER0)),s.data());MASTER_READY=true;render();}},()=>{});
  }
  db.collection('proposals').onSnapshot(s=>{clearTimeout(t);PROPS={};s.docs.forEach(d=>PROPS[d.id]=d.data());if(role==='client')setConn('共有データ','ok');render();},()=>{});
}
function goLocal(){
  /* 共有データにつながらないときは店舗の画面だけ（本社の画面と原価は出さない） */
  CAP.mode='local';CAP.role=window.__SUMISURA_ROLE||'store';
  KARTES=lsGet('_k')||{};CASES=CAP.role==='hq'?(lsGet('_c')||{}):{};PROPS=lsGet('_p')||{};
  const ids=sortedCases();if(ids.length)openCase(ids[0],true);
  setConn('サーバーにつながっていません（この端末のみ）','warn');applyRole();render();
}
function setConn(t,k){const e=$('conn');e.textContent=t;e.style.background=k==='ok'?'rgba(143,209,156,.25)':k==='warn'?'rgba(240,178,106,.25)':'transparent';}
function applyRole(){
  const r=CAP.role,allowed={hq:['store','hq','client'],store:['store','client'],client:['client']}[r];
  document.querySelectorAll('.lines button').forEach(b=>b.hidden=!allowed.includes(b.dataset.line));
  if(r!=='hq'){$('hqLine')?.remove();document.querySelector('.lines button[data-line="hq"]')?.remove();}

const ctToMm=ct=>6.5*Math.cbrt(ct);
const mmToCt=mm=>Math.pow(mm/6.5,3);
function sideById(id){return M.sides.find(s=>s.id===id);}
function nearestSide(mm,kind='dia'){let b=null;M.sides.filter(s=>s.kind===kind).forEach(s=>{if(!b||Math.abs(s.mm-mm)<Math.abs(b.mm-mm))b=s;});return b;}
function centerMm(d,c=CASE){return d.ctype==='dia'?ctToMm(d.ct):d.ctype==='consign'?(+c.k.cs.mm||ctToMm(+c.k.cs.ct||0.3)):d.ctype==='color'?(+d.cmm||5):0;}
function calibKey(d){return d.item+'_'+d.model;}
/* 脇石の行（ハローは自動で1行） */
function sideRows(c=CASE){const d=c.d,G=geomRaw(d,c),rows=[];
  if(d.model==='halo'&&G.cmm){const s=nearestSide(d.m);if(s)rows.push({mid:s.id,qty:G.meleN*G.pcs,set:'共有爪',auto:true});}
  (c.q.sides||[]).forEach(r=>rows.push(r));return rows;}
function geomRaw(d,c=CASE){
  const pcs=d.item==='pierce'?2:1,cmm=centerMm(d,c);
  const prongs=d.model==='sol6'?6:4;
  const p=Math.min(1.5,Math.max(0.8,0.55+0.09*(cmm||3)));
  const pav=0.43*cmm,crown=0.16*cmm,setH=d.seth==='low'?1.6:2.6;
  const parts={};
  parts['爪']=cmm?prongs*Math.PI*(p/2)**2*(pav+crown+setH+0.4):0;

    ${now>=0?`<p class="prnext"><b>次にやること（${R[now].who}）</b>${esc(R[now].t)}</p>`:'<p class="prnext ok"><b>完了</b>受注までの業務はすべて済んでいます。</p>'}
    ${open&&!P&&days>=3?'<div class="chk 注意"><b>日数</b><div>受付から3日以上たっています。<small>2回目のご来店までに見積書を届けられるよう、優先して進めてください。</small></div></div>':''}
    ${exp?`<div class="chk 注意"><b>期限</b><div>お見積の有効期限（${esc(P.items[0].valid)}）を過ぎています。<small>ご注文の前に、本社で見積を出し直してください。</small></div></div>`:''}
    <ol class="prl">${R.map((r,i)=>`<li class="${r.done?'done':i===now?'now':''}"><i>${r.done?'✓':i+1}</i><span class="pw ${r.who==='店舗'?'s':'h'}">${r.who}</span><div>${esc(r.t)}${r.warn?`<small class="pwarn">${r.warn}</small>`:''}${r.at?`<small>${fmtDT(r.at)}</small>`:''}</div>
      ${r.manual&&r.by===role?`<button class="chipbtn" data-pchk="${r.manual}">${r.done&&(k.chk||{})[r.manual]?'取り消す':'済みにする'}</button>`:r.tab&&role==='hq'&&!r.done&&i===now&&opt.nav?`<button class="chipbtn gold" data-ptab="${r.tab}">開く</button>`:''}</li>`).join('')}</ol></div>`;}
function bindProgress(root,rerender){root.querySelectorAll('[data-pchk]').forEach(b=>b.onclick=async()=>{const id=b.closest('[data-prg]').dataset.prg,key=b.dataset.pchk;
    if(await kPut(id,k=>{k.chk=k.chk||{};if(k.chk[key])delete k.chk[key];else k.chk[key]=new Date().toISOString();}))rerender();});
  root.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{const id=b.closest('[data-prg]').dataset.prg,k=KARTES[id];if(b.dataset.ptab==='inbox')return;if(k?.caseId&&CASES[k.caseId]){if(!CASE||CASE.id!==k.caseId)openCase(k.caseId,true);go(b.dataset.ptab);}});}
</script>
