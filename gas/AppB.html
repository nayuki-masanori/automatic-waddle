<script>
/* Sumisura 動き（後半）：連絡・店舗の画面・起動 */
/* 連絡（店舗↔本社）：質問・補足・見積やデザインの修正依頼 */
function msgUnread(k,role){const m=(k.msgs||[]).at(-1);return !!m&&m.from!==role&&k.msgAck!==m.at;}
function msgHTML(k){const role=CAP.role==='hq'&&line==='hq'?'本社':'店舗',L=k.msgs||[],un=msgUnread(k,role),canRev=role==='店舗'&&!!(k.caseId&&PROPS[k.caseId])&&K_ORDER.indexOf(k.status)<5;
  return `<div class="msg" data-msg="${k.id}"><div class="kdh"><h3 style="margin:0">${role==='店舗'?'本社との連絡':'店舗との連絡'}</h3>${un?`<span class="rs open">${role==='店舗'?'本社':'店舗'}から連絡があります</span>`:''}</div>
    ${L.length?`<div class="msgl">${L.map(m=>`<div class="mb ${m.from===role?'me':''}"><small>${esc(m.from)}${m.who?'・'+esc(m.who):''}　${fmtDT(m.at)}${m.type==='rev'?'　<b>修正依頼</b>':''}</small><p>${esc(m.text)}</p></div>`).join('')}</div>`:`<p class="muted" style="margin:0">${role==='店舗'?'本社への質問・補足や、お客様からの修正のご希望（もう少し抑えた価格で、石を大きく など）を送れます。':'カルテの不足や確認したいことを店舗に送れます。店舗の画面に表示されます。'}</p>`}
    <textarea data-mtxt placeholder="${role==='店舗'?'例：お客様より、メレを減らしてご予算30万円以内にしたいとのご希望です。':'例：お預りの石の縦・横・高さをノギスで測って、写真と一緒に送ってください。'}"></textarea>
    <div class="btns">${canRev?'<label class="chk1" style="margin-right:auto"><input type="checkbox" data-mrev> 見積・デザインの修正依頼として送る</label>':''}${un?'<button class="btn ghost sm" data-mack>確認済みにする</button>':''}<button class="btn" data-msend>${role==='店舗'?'本社に送る':'店舗に送る'}</button></div></div>`;}
function bindMsg(root,rerender){root.querySelectorAll('[data-msg]').forEach(box=>{const id=box.dataset.msg,role=CAP.role==='hq'&&line==='hq'?'本社':'店舗';
    box.querySelector('[data-msend]').onclick=async()=>{const t=box.querySelector('[data-mtxt]').value.trim();if(!t)return toast('連絡の内容を書いてください');const rev=box.querySelector('[data-mrev]')?.checked;
      if(await kPut(id,k=>{k.msgs=k.msgs||[];k.msgs.push({from:role,who:role==='店舗'?(k.staff||''):'',text:t,type:rev?'rev':'',at:new Date().toISOString()});})){toast(role==='店舗'?'本社に送りました':'店舗に送りました');rerender();}};
    box.querySelector('[data-mack]')?.addEventListener('click',async()=>{if(await kPut(id,k=>{k.msgAck=(k.msgs||[]).at(-1)?.at||null;}))rerender();});});}
function hqMsgKartes(){return Object.values(KARTES).filter(k=>k.status!=='下書き'&&msgUnread(k,'本社'));}

/* ═════════ 本社：案件の帯 ═════════ */
function stage(c){if(!c)return -1;if(c.settle?.done)return 5;if(c.order?.done)return 4;if(PROPS[c.id])return 3;if(c.quote)return 2;return 1;}
function nextStep(c){
  const s=stage(c);
  if(s===1){const q=quoteCalc(c);if(!c.img?.finals?.some(f=>f.pick)&&!(+c.q.w>0))return ['デザイン画像を作り、お客様に見せる案を採用する','image','デザイン画像へ'];return !(+c.q.w>0)?['仕様・3Dで型と寸法を決め、地金重量を見積に入れる','design','仕様・3Dへ']:c.d.ctype==='dia'&&!(+c.q.center.unit>0)?['中石のct単価を入れて見積を発行する','est','見積へ']:['見積を発行する','est','見積へ'];}
  if(s===2)return ['お客様用の見積書（Design & Quotation）を公開する','publish','見積書へ'];
  if(s===3)return ['受注したら内金を受け取り、受注を確定する','order','受注へ'];
  if(s===4)return ['完成したら実重量・石目を入れて精算する','settle','精算へ'];
  return ['精算済み。補正係数を見直す','master','原価マスターへ'];}
function renderStrip(){
  {const n=Object.values(KARTES).filter(k=>k.status==='本社待ち'&&!k.seen).length+orderReqs().length+hqMsgKartes().length,t=document.querySelector('.tab[data-t="inbox"]');if(t){let b=t.querySelector('.badge');if(n){if(!b){b=document.createElement('em');b.className='badge';t.appendChild(b);}b.textContent=n;b.title=`未確認のカルテ・受注連絡 ${n}件`;}else if(b)b.remove();}}
  const ids=sortedCases();
  $('caseSel').innerHTML=ids.length?ids.map(i=>`<option value="${i}">${esc(CASES[i].no)}　${esc(CASES[i].k?.name||'')}</option>`).join(''):'<option value="">案件はまだありません</option>';
  if(CASE)$('caseSel').value=CASE.id;
  const s=stage(CASE);$('pipe').innerHTML=CASE?STATUS.map((x,i)=>`<i class="${i<s?'done':i===s?'now':''}">${x}</i>`).join(''):'';
  if(CASE){const [t,tab,lbl]=nextStep(CASE);$('nextTxt').textContent=t;$('nextBtn').textContent=lbl;$('nextBtn').onclick=()=>go(tab);$('nextBtn').hidden=false;}
  else{$('nextTxt').textContent='受信したカルテを開いて案件にします';$('nextBtn').hidden=true;}}

/* ① 受信：カルテの中身を本社で確認 → 案件にする → ②へ */
let INSEL=null; // {t:'k',id} 届いたカルテ / {t:'c',id} 案件
const fmtDT=s=>s?new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function karteDetailHTML(k,head){const cs=k.cs||{},R=(l,v)=>v===''||v==null?'':`<tr><th>${l}</th><td>${v}</td></tr>`;
  const dim=[cs.L&&`縦 ${cs.L}`,cs.W&&`横 ${cs.W}`,cs.H&&`高さ ${cs.H}`].filter(Boolean).join(' × ');
  return `${head||''}
  <table class="kv">
    ${R('お客様',`<b>${esc(k.name||'')}</b> 様`)}${R('店舗・担当',`${esc(k.store||'')}店・${esc(k.staff||'')}`)}${R('用途',esc(k.purpose||''))}
    ${R('アイテム',`${ITEMS_JP[k.item]||''}${k.item==='ring'?`（${+k.size?k.size+'号':'サイズ未計測'}）`:''}`)}${R('希望の地金',esc(k.metal||'')+(k.metal==='未定'?'（おまかせ）':''))}${R('中石の希望',esc(k.stone||'')+(k.stoneNote?`<div class="muted">${esc(k.stoneNote)}</div>`:''))}
    ${R('ご予算（税込）',k.bnote?'<b>ご相談</b>':`<b>${yen(+k.bmax||0)}</b> まで`)}${R('ご希望納期',k.dueNote==='特になし'?'特に決まっていない':esc(k.due||''))}${(k.moods||[]).length?R('お好きな雰囲気',k.moods.map(m=>STYLES[m]?.n).filter(Boolean).join('・')):''}
  </table>
  <div class="kreq"><h3>ご要望</h3><p>${esc(k.req||'（記入なし）')}</p></div>
  ${cs.has==='yes'?`<div class="kreq"><h3>お預り品</h3><table class="kv">${cs.type!=='石なし（その他の品のみ）'?R('石',`${esc(cs.type)}・${esc(cs.shape)}${cs.ct?`・${cs.ct}ct`:''}`)+R('大きさ（mm）',dim||'未計測')+R('状態・鑑別書',`${esc(cs.cond)}・鑑別書 ${esc(cs.cert)}`):''}${R('その他の品',esc(cs.other||''))}</table></div>`:''}
  <div class="kreq"><h3>希望デザインに近い画像（${(k.design||[]).length}枚）</h3>${(k.design||[]).length?`<div class="kdes">${k.design.map(a=>`<figure><button data-lb="${esc(a.url)}"><img src="${esc(a.url)}" alt="希望デザイン"></button>${a.note?`<figcaption>${esc(a.note)}</figcaption>`:''}</figure>`).join('')}</div><p class="muted" style="margin:4px 0 0">案件にすると、②デザイン画像の参考資料になります。</p>`:'<span class="muted">なし</span>'}</div>
  <div class="kreq"><h3>お預り品の写真・資料（${(k.refs||[]).length}件）</h3><div class="kimgs">${(k.refs||[]).map(a=>a.pdf?`<a class="kdoc" href="${esc(a.url)}" target="_blank" rel="noopener">PDF<small>${esc(a.name)}</small></a>`:`<button data-lb="${esc(a.url)}" title="${esc(a.name)}"><img src="${esc(a.url)}" alt="${esc(a.name)}"></button>`).join('')||'<span class="muted">なし</span>'}</div></div>
  <p class="muted" style="margin:0">送信 ${fmtDT(k.sentAt)}${k.seenAt?`・受信確認 ${fmtDT(k.seenAt)}`:''}</p>`;}
function lightbox(url){let lb=$('lb');if(!lb){lb=document.createElement('div');lb.id='lb';lb.className='lb';lb.onclick=()=>lb.hidden=true;document.body.appendChild(lb);}lb.innerHTML=`<img src="${esc(url)}" alt=""><span>閉じる</span>`;lb.hidden=false;}
async function takeKarte(id){const k=KARTES[id];if(!k.seen){k.seen=true;k.seenAt=new Date().toISOString();}const c=blankCase(k);CASES[c.id]=c;await put('cases',c.id,c);await setKarteStatus(k.id,'本社対応中',c.id);
  CASE=migrateImg(JSON.parse(JSON.stringify(c)));lastKey='';thumbKey='';INSEL={t:'c',id:c.id};toast(`案件 ${c.no} を作りました。②デザイン画像へ進めます`);render();}
function renderInbox(){
  renderOrderReqs();
  {const el=$('in_msgs'),L=hqMsgKartes();el.hidden=!L.length;if(L.length){el.innerHTML=`<h2>店舗からの連絡（未対応）</h2><div class="list">${L.map(k=>{const m=k.msgs.at(-1);return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(k.name)} 様${m.type==='rev'?'　<span class="rs lost">修正依頼</span>':''}</b><span class="muted">${esc(k.store)}・${fmtDT(m.at)}　${esc(m.text.slice(0,48))}${m.text.length>48?'…':''}</span></div><button class="chipbtn gold" data-msel="${k.id}">開く</button></div>`;}).join('')}</div>`;
    el.querySelectorAll('[data-msel]').forEach(b=>b.onclick=()=>{const k=KARTES[b.dataset.msel];if(k.caseId&&CASES[k.caseId]){openCase(k.caseId,true);INSEL={t:'c',id:k.caseId};}else INSEL={t:'k',id:k.id};render();$('in_detail').scrollIntoView({block:'start'});});}}
  const ks=Object.values(KARTES).filter(k=>k.status==='本社待ち').sort((a,b)=>(a.sentAt||a.updatedAt||'').localeCompare(b.sentAt||b.updatedAt||''));
  const ids=sortedCases();
  if(!INSEL||(INSEL.t==='k'&&!ks.some(k=>k.id===INSEL.id))||(INSEL.t==='c'&&!CASES[INSEL.id]))INSEL=CASE?{t:'c',id:CASE.id}:ks[0]?{t:'k',id:ks[0].id}:ids[0]?{t:'c',id:ids[0]}:null;
  $('in_legend').innerHTML=K_STEPS.map((x,i)=>`<span class="stb st${i}">${x}</span>`).join(' ');
  $('in_new').innerHTML=ks.length?ks.map(k=>`<div class="row${INSEL?.t==='k'&&INSEL.id===k.id?' sel':''}" style="grid-template-columns:minmax(0,1fr)"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(k.name)} 様</b>${stBadge(k)}</div>
    <span class="muted">${esc(k.store)}・${esc(k.staff)}・${ITEMS_JP[k.item]}・ご予算 ${yen(+k.bmax)}・送信 ${fmtDT(k.sentAt)}</span>
    <div class="btns"><button class="btn sm" data-ksel="${k.id}">内容を見る</button><button class="btn gold sm" data-take="${k.id}">案件にする</button></div></div>`).join(''):'<div class="empty">新しく届いたカルテはありません。</div>';
  $('in_new').querySelectorAll('[data-ksel]').forEach(b=>b.onclick=async()=>{const k=KARTES[b.dataset.ksel];INSEL={t:'k',id:k.id};
    if(!k.seen){k.seen=true;k.seenAt=new Date().toISOString();await put('kartes',k.id,k);toast(`「${k.name}」様のカルテを受信確認しました（店舗に表示されます）`);}render();});
  $('in_new').querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>takeKarte(b.dataset.take));
  $('in_cases').innerHTML=ids.length?ids.map(i=>{const c=CASES[i];return `<div class="row${INSEL?.t==='c'&&INSEL.id===i?' sel':''}"><div><b>${esc(c.no)}　${esc(c.k?.name||'')} 様</b><span class="muted">${esc(c.k?.store||'')}・${ITEMS_JP[c.d.item]}・<b style="font-weight:500">${STATUS[stage(c)]}</b></span></div>
    <div class="btns"><button class="chipbtn" data-open="${i}">開く</button><button class="chipbtn" data-cdel="${i}">削除</button></div></div>`;}).join(''):'<div class="empty">案件はまだありません。</div>';
  $('in_cases').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{openCase(b.dataset.open,true);INSEL={t:'c',id:b.dataset.open};render();});
  $('in_cases').querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{const id=b.dataset.cdel;
    if(PROPS[id])return toast('公開中の見積書があるため削除できません。先に⑤で公開をやめてください');
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='もう一度で削除';setTimeout(()=>{b.dataset.arm='';b.textContent='削除';},2500);return;}
    const c=CASES[id];for(const x of [...(c.img?.vers||[]),...(c.img?.sheets||[]),...(c.img?.finals||[])])await dropImage(x.img);
    if(await del('cases',id)){if(c.kId&&KARTES[c.kId])await setKarteStatus(c.kId,'本社待ち',null);if(CASE&&CASE.id===id)CASE=null;INSEL=null;toast('案件を削除しました');render();}});
  // 右：カルテの内容
  const D=$('in_detail');
  if(!INSEL){D.innerHTML='<h2>カルテの内容</h2><div class="empty">店舗からカルテが届くと、ここに中身が表示されます。</div>';return;}
  if(INSEL.t==='k'){const k=KARTES[INSEL.id];
    D.innerHTML=progressHTML(k,{nav:true})+'<hr class="hr">'+msgHTML(k)+'<hr class="hr">'+karteDetailHTML(k,`<div class="kdh"><h2>カルテの内容</h2>${stBadge(k)}</div>`)+`<div class="btns"><button class="btn gold" data-take2="${k.id}">案件にして ②デザイン画像へ</button></div><p class="muted" style="margin:0">足りない情報があれば、案件にする前に店舗へ連絡してください（店舗側で修正して再送できます）。</p>`;
    D.querySelector('[data-take2]').onclick=async()=>{await takeKarte(k.id);go('image');};}
  else{const c=CASES[INSEL.id],k=KARTES[c.kId]||c.k;
    D.innerHTML=progressHTML(KARTES[c.kId]||k,{nav:true})+'<hr class="hr">'+(KARTES[c.kId]?msgHTML(KARTES[c.kId])+'<hr class="hr">':'')+karteDetailHTML(k,`<div class="kdh"><h2>カルテの内容</h2><span class="stb st${Math.min(7,3+stage(c))}">${esc(c.no)}・${STATUS[stage(c)]}</span></div>`)+
      (CASE&&CASE.id===c.id?`<div class="btns"><button class="btn gold" data-go="image">② デザイン画像へ</button></div>`:`<div class="btns"><button class="btn gold" data-open2="${c.id}">この案件を開いて ②へ</button></div>`);
    D.querySelector('[data-open2]')?.addEventListener('click',()=>{openCase(c.id,true);go('image');});}
  D.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>lightbox(b.dataset.lb));bindProgress(D,render);bindMsg(D,render);}

/* ② デザイン */
function fixMetal(){if(!METAL_BY_ITEM[CASE.d.item].includes(CASE.d.metal))CASE.d.metal='Pt950';}
function initDesign(){
  segInit('d_item',()=>CASE?.d.item,v=>{CASE.d.item=v;fixMetal();},Object.entries(ITEMS_JP));
  segInit('d_model',()=>CASE?.d.model,v=>{CASE.d.model=v;},Object.entries(MODELS));
  segInit('d_seth',()=>CASE?.d.seth,v=>CASE.d.seth=v);
  segInit('d_ctype',()=>CASE?.d.ctype,v=>{CASE.d.ctype=v;});
  $('d_size').innerHTML=Array.from({length:19},(_,i)=>`<option value="${i+5}">${i+5}号</option>`).join('');
  $('d_cstone').innerHTML=COLORCENTER.map(s=>`<option>${s}</option>`).join('');
  $('d_chain').innerHTML=['chain20','chain25','chain30'].map(k=>`<option value="${k}">${M.parts[k].n}</option>`).join('');
  ['metal','finish','prof','cstone','chain','dir'].forEach(k=>bind('d_'+k,'c','d.'+k));
  ['size','W','H','D','skel','cmm','w','t','ct','m'].forEach(k=>bind('d_'+k,'c','d.'+k,true));
  $('addAnc').onclick=()=>{CASE.anchors.push({cat:'外形',text:'',lock:true});touch();};
  $('useW').onclick=()=>{CASE.q.w=wQuote();touch();toast(`見積の地金重量を ${f2(CASE.q.w)}g にしました（3D推定＋見立て余裕${Math.round(wM()*100)}%）`);};
}
function targetHTML(small){const I=CASE.img||{},picks=(I.finals||[]).filter(f=>f.pick).slice(0,3),r=I.read;
  if(!picks.length)return `<div class="tgth"><h2>見積対象のデザイン</h2><button class="btn ghost sm" data-go="image">② デザイン画像へ</button></div><div class="empty">②デザイン画像で「採用」した画像がここに表示されます。採用画像を見ながら、型・寸法・石を合わせてください。</div>`;
  const rows=r?.rows?.filter(x=>x.on)||[];
  const spec=rows.length?rows.map(x=>`${x.k==='center'?'中石':'脇石'} ${x.kind==='dia'?'ダイヤ':esc(x.color||'色石')} Ø${x.mm}mm${x.k==='side'?` ×${x.count}`:''}`).join('・'):'';
  return `<div class="tgth"><h2>見積対象のデザイン</h2><span class="muted">②で採用・${picks.length}枚</span><button class="btn ghost sm" data-go="image">②で変更</button></div>
    <div class="tgti n${picks.length}">${picks.map(f=>`<button data-lb="${esc(f.img.url)}" title="拡大"><img src="${esc(f.img.url)}" alt="採用画像"></button>`).join('')}</div>
    ${spec?`<p class="muted" style="margin:0">読み取った仕様：${spec}${r.sent?'（見積に送信済み）':''}</p>`:small?'':'<p class="muted" style="margin:0">②の「見積に渡す」で石の数・大きさを読み取ると、ここに並びます。</p>'}
    ${matchHTML()}
    ${small?'':'<p class="muted" style="margin:0">この画像に3D（下）が近くなるよう、左で型・寸法・石を合わせます。画像を押すと拡大します。</p>'}`;}
function matchRows(){const r=CASE.img?.read,d=CASE.d;if(!r?.rows)return null;const on=r.rows.filter(x=>x.on),out=[];
  const c=on.find(x=>x.k==='center');
  if(d.ctype==='dia'){const ci=c&&c.kind==='dia'?mmToCt(c.mm):0;out.push({n:'中石ダイヤ',img:c?`Ø${c.mm}mm（約${f2(ci)}ct）`:'なし',est:`${(+d.ct).toFixed(2)}ct`,ok:!!c&&Math.abs(ci-d.ct)<=Math.max(0.03,d.ct*0.1)});}
  else if(c&&d.ctype==='none')out.push({n:'中石',img:`Ø${c.mm}mm`,est:'なし',ok:false});
  const si=on.filter(x=>x.k==='side'),ni=si.reduce((a,x)=>a+(+x.count||0),0),cti=si.filter(x=>x.kind==='dia').reduce((a,x)=>a+mmToCt(x.mm)*x.count,0);
  const sq=sideRows(CASE).map(x=>({s:sideById(x.mid),q:+x.qty||0})).filter(x=>x.s&&x.q),nq=sq.reduce((a,x)=>a+x.q,0),ctq=sq.filter(x=>x.s.kind==='dia').reduce((a,x)=>a+x.s.ct*x.q,0);
  if(ni||nq){out.push({n:'脇石の数',img:`${ni}石`,est:`${nq}石`,ok:ni===nq});out.push({n:'脇石ダイヤ 合計',img:`約${f3(cti)}ct`,est:`${f3(ctq)}ct`,ok:Math.abs(cti-ctq)<=Math.max(0.01,ctq*0.1)});}
  if(d.item==='ring'&&d.model!=='free'&&r.band>0)out.push({n:'腕幅',img:`約${(+r.band).toFixed(1)}mm`,est:`${(+d.w).toFixed(1)}mm`,ok:Math.abs(r.band-d.w)<=0.3});
  return out;}
function matchHTML(){const m=matchRows();if(!m||!m.length)return '';const bad=m.filter(x=>!x.ok).length;
  return `<table class="mt"><tr><th>画像と見積の照合</th><th>画像（読み取り）</th><th>見積の仕様</th><th></th></tr>${m.map(x=>`<tr class="${x.ok?'':'ng'}"><td>${x.n}</td><td>${x.img}</td><td>${x.est}</td><td>${x.ok?'一致':'差あり'}</td></tr>`).join('')}</table>
  ${bad?'<p class="muted" style="margin:0">差がある行は、③④で仕様を画像に合わせるか、②「仕上げる」で<b>見積の仕様に合わせた確定画像</b>を作って、どちらかにそろえてください。</p>':''}`;}
function renderTarget(id,small){const el=$(id);if(!el)return;el.innerHTML=targetHTML(small);el.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>lightbox(b.dataset.lb));}
function renderDesign(){

function autoTexts(c=CASE){const d=c.d,q=c.quote,cs=c.k.cs||{},it=ITEMS_JP[d.item].replace('（ペア）',''),consign=d.ctype==='consign';

async function publish(){
  const d=CASE.d,q=CASE.quote;if(!q)return;$('pb_go').disabled=true;$('pb_go').textContent='公開しています…';

      const u=snapView(c.v,d.item,CAP.assets?1000:480);if(!u)continue;
      if(CAP.assets){const r=await putImage(dataUrlToBlob(u),`3d_${c.v}.jpg`);if(!r.local)imgs.push({url:r.url,id:r.id,ai:false,label:'3D Image'});}else imgs.push({url:u,ai:false,label:'3D Image'});}
    lastKey='';
    const item=Object.assign(draft,{images:imgs});
    const prev=PROPS[CASE.id]||{items:[]};const items=prev.items.filter(x=>x.slot!==item.slot).concat(item).sort((a,b)=>a.slot.localeCompare(b.slot));
    const doc={caseNo:CASE.no,name:CASE.k.name,store:CASE.k.store,staff:CASE.k.staff,items,settle:prev.settle||null,updatedAt:new Date().toISOString()};

    if(await put('proposals',CASE.id,doc)){PROPS[CASE.id]=doc;if(CASE.k?.id)setKarteStatus(CASE.k.id,'提案済み',CASE.id);touch();
      $('pb_go').textContent='PDFを作っています…';const blob=await dqDocPdf(doc);
      if(blob&&CAP.assets){if(prev.pdf?.id)try{await CAP.assets.delete(prev.pdf.id);}catch(e){}
        const r=await CAP.assets.upload(new File([blob],dqName(doc),{type:'application/pdf'}));doc.pdf={id:r.id,url:r.url,name:dqName(doc),at:new Date().toISOString()};await put('proposals',CASE.id,doc);PROPS[CASE.id]=doc;
        toast(`${item.slot}を公開し、PDFを店舗に送りました`);}
      else if(blob){toast(`${item.slot}を公開しました（共有なしのため、PDFはこの端末に保存します）`);await saveFile(dqName(doc),blob);}

function settleCalc(c=CASE){
  const q=c.quote,s=c.settle;if(!q)return null;const lines=[];
  const wA=+s.w>0?+s.w:null;
  lines.push({n:`地金 ${q.metal}`,est:`${f2(q.w)}g`,act:wA!=null?`${f2(wA)}g`:'',unit:`${yen(q.gPrice)}/g ×（1＋${(q.loss*100).toFixed(0)}%）`,diff:wA!=null?(wA-q.w)*q.gPrice*(1+q.loss):0,ready:wA!=null,key:'w'});
  if(q.center.type==='dia'){const ctA=+s.ct>0?+s.ct:null;lines.push({n:'中石 ダイヤ',est:`${(+q.center.ct).toFixed(2)}ct${q.pcs>1?'×2':''}`,act:ctA!=null?`${ctA.toFixed(2)}ct`:'',unit:`${yen(q.center.unit)}/ct`,diff:ctA!=null?(ctA-q.center.ct)*q.center.unit*q.pcs:0,ready:ctA!=null,key:'ct'});}
  q.sides.forEach(sd=>{const a=s.sides?.[sd.key||sd.mid];const ctA=a&&+a.ct>0?+a.ct:null;lines.push({n:`脇石 ${sd.name}`,est:`${sd.qty}個 ${f3(sd.ctT)}ct`,act:ctA!=null?`${a.qty||sd.qty}個 ${f3(ctA)}ct`:'',unit:`${yen(sd.uct)}/ct（${yen(sd.pc)}/個）`,diff:ctA!=null?(ctA-sd.ctT)*sd.uct:0,ready:ctA!=null,key:'s_'+(sd.key||sd.mid)});});
  const dCost=lines.reduce((a,l)=>a+l.diff,0),cost=q.cost+dCost,r=q.rule;
  const adj=priceOf(cost,r.margin,r.unit,r.round,r.tax);
  const capped=adj&&adj.inc>q.inc;const finalInc=adj?Math.min(adj.inc,q.inc):q.inc;const finalPre=capped?q.pre:adj?adj.pre:q.pre;
  const gm=1-cost/finalPre;const paid=+c.order.paid||0;
  return {lines,dCost,cost,adj,capped,finalInc,finalPre,gm,paid,balance:finalInc-paid,allReady:lines.every(l=>l.ready)};}
